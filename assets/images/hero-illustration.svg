<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" fill="none">
  <style>
    .primary { fill: #1a73e8; }
    .secondary { fill: #0d47a1; }
    .accent { fill: #6200ee; }
    .light { fill: #f8f9fa; }
    .dark { fill: #202124; }
  </style>
  
  <!-- Background Elements -->
  <rect x="50" y="50" width="400" height="300" rx="10" class="light" opacity="0.8"/>
  
  <!-- Document Stack -->
  <rect x="100" y="100" width="250" height="200" rx="5" class="light" stroke="#dadce0" stroke-width="2"/>
  <rect x="110" y="90" width="250" height="200" rx="5" class="light" stroke="#dadce0" stroke-width="2"/>
  <rect x="120" y="80" width="250" height="200" rx="5" fill="white" stroke="#dadce0" stroke-width="2"/>
  
  <!-- Document Content -->
  <rect x="140" y="100" width="150" height="10" rx="2" class="primary"/>
  <rect x="140" y="120" width="210" height="6" rx="2" class="dark" opacity="0.7"/>
  <rect x="140" y="135" width="210" height="6" rx="2" class="dark" opacity="0.7"/>
  <rect x="140" y="150" width="180" height="6" rx="2" class="dark" opacity="0.7"/>
  
  <rect x="140" y="170" width="120" height="8" rx="2" class="secondary"/>
  <rect x="140" y="185" width="210" height="6" rx="2" class="dark" opacity="0.7"/>
  <rect x="140" y="200" width="210" height="6" rx="2" class="dark" opacity="0.7"/>
  <rect x="140" y="215" width="180" height="6" rx="2" class="dark" opacity="0.7"/>
  
  <rect x="140" y="235" width="80" height="25" rx="12.5" class="primary"/>
  <text x="155" y="252" font-family="Arial" font-size="12" fill="white">Read More</text>
  
  <!-- Decorative Elements -->
  <circle cx="380" cy="100" r="30" class="accent" opacity="0.2"/>
  <circle cx="380" cy="100" r="20" class="accent" opacity="0.3"/>
  <circle cx="380" cy="100" r="10" class="accent" opacity="0.4"/>
  
  <circle cx="100" cy="250" r="25" class="primary" opacity="0.2"/>
  <circle cx="100" cy="250" r="15" class="primary" opacity="0.3"/>
  <circle cx="100" cy="250" r="5" class="primary" opacity="0.4"/>
  
  <!-- Abstract Lines -->
  <path d="M400 200 Q 450 150, 430 100" stroke="#dadce0" stroke-width="3" fill="none"/>
  <path d="M400 220 Q 450 170, 430 120" stroke="#dadce0" stroke-width="3" fill="none"/>
  <path d="M400 240 Q 450 190, 430 140" stroke="#dadce0" stroke-width="3" fill="none"/>
</svg>